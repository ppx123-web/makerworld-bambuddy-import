<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head><body>
<h1>导入到 Bambuddy</h1><label for="address">Bambuddy 地址</label><div class="row"><input id="address" type="url" placeholder="http://服务器:3215"><button id="save">保存</button></div><p class="hint">首次保存时，Chrome 会请求访问该地址的权限。请在另一个标签页登录 Bambuddy。</p><hr><p>在 MakerWorld 的模型页面选择打印配置，然后点击下方按钮。</p><button id="import" class="primary">下载并导入当前配置</button><p id="status" role="status" aria-live="polite"></p><button id="open" class="secondary">打开文件管理器</button><script src="popup.js"></script></body></html>
